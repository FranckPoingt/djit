[project]
name = "djit-server"
version = "0.1.0"
description = "DJ-IT FastAPI backend"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<1.14",
  "essentia>=2.1b6.dev1389",
  "fastapi>=0.111,<0.142",
  "librosa>=0.10,<0.11",
  "mutagen>=1.46,<1.49",
  "numpy>=1.24,<2",
  "pydantic>=2.7,<3",
  "sqlalchemy>=2.0,<2.1",
  "sse-starlette>=2.1,<4",
  "uvicorn[standard]>=0.30,<0.54"
]

[dependency-groups]
dev = [
  "httpx>=0.28,<0.29",
  "pyinstaller>=6.11,<7",
  "pytest>=8.2,<10",
  "ruff>=0.5,<0.6"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["djit"]
