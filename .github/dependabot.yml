version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      frontend:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # openapi-typescript 7 uses the TypeScript 5 compiler API; TS 7 breaks codegen.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: uv
    directory: /apps/server
    schedule:
      interval: weekly
    groups:
      backend:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
