name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v2
      - run: mise exec gitleaks@8.30.1 -- gitleaks dir . --redact --no-banner
      - run: ./scripts/bootstrap.sh
      - run: ./scripts/mise-exec.sh pnpm run lint
      - run: ./scripts/mise-exec.sh pnpm run test
      - run: ./scripts/mise-exec.sh pnpm run codegen
      - run: git diff --exit-code -- apps/server/openapi.json packages/api-client/src/generated.ts
      - run: ./scripts/build.sh
      - run: codesign --verify --deep --strict --verbose=2 dist/DJ-IT.app
      - run: ./scripts/mise-exec.sh python scripts/smoke-packaged.py
